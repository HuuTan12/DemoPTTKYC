version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: fastship_mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fastship
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
